services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-python_db}
      MYSQL_USER: ${DB_USER:-b2b}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./web_b2b.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  django:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-python_db}
      DB_USER: ${DB_USER:-b2b}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./server/upload:/app/upload
    expose:
      - "8000"

  next:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.next
      args:
        NEXT_PUBLIC_HOST: ${DOMAIN:-localhost}
    restart: unless-stopped
    depends_on:
      - django
    environment:
      NEXT_PUBLIC_HOST: ${DOMAIN:-localhost}
      NEXT_PUBLIC_DJANGO_BASE_URL: http://django:8000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - next
      - django
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/upload:/var/www/upload:ro

volumes:
  db_data:
